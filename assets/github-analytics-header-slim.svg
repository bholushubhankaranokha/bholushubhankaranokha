<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80" role="img" aria-label="GitHub Analytics" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>GitHub Analytics</title>
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ff3b3b"/><stop offset=".5" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff1f4b"/>
      <animate attributeName="x1" values="0;2" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;3" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3b3b" stop-opacity="0"/><stop offset="1" stop-color="#ff3b3b" stop-opacity=".8"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3b3b" stop-opacity=".8"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></linearGradient>
  </defs>

  <!-- thin side lines + travelling dots -->
  <rect x="60" y="39.5" width="320" height="1" fill="url(#l)"/>
  <rect x="820" y="39.5" width="320" height="1" fill="url(#r)"/>
  <circle cy="40" r="2" fill="#ff8a5c"><animate attributeName="cx" values="380;60" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
  <circle cy="40" r="2" fill="#ff8a5c"><animate attributeName="cx" values="820;1140" dur="3s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>

  <!-- logo -->
  <g transform="translate(410,18)" fill="none" stroke="#ff3b3b" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="1" width="42" height="42" rx="11" stroke-width="1.5"/>
    <rect x="1" y="1" width="42" height="42" rx="11" stroke="#ff8a5c" stroke-width="2" stroke-dasharray="30 138"><animate attributeName="stroke-dashoffset" from="0" to="-168" dur="4s" repeatCount="indefinite"/></rect>
    <g fill="#ff3b3b" stroke="none">
      <rect x="10" y="26" width="5" height="9" rx="1.5"><animate attributeName="height" values="9;15;9" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="26;20;26" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="19.5" y="18" width="5" height="17" rx="1.5"><animate attributeName="height" values="17;10;17" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="18;25;18" dur="2.8s" repeatCount="indefinite"/></rect>
      <rect x="29" y="22" width="5" height="13" rx="1.5"><animate attributeName="height" values="13;21;13" dur="3.2s" repeatCount="indefinite"/><animate attributeName="y" values="22;14;22" dur="3.2s" repeatCount="indefinite"/></rect>
    </g>
    <path d="M8 22 L17 15 L25 18 L36 8" stroke="#ff8a5c" stroke-width="1.6" stroke-dasharray="48" stroke-dashoffset="48"><animate attributeName="stroke-dashoffset" values="48;0;0;-48" keyTimes="0;.5;.8;1" dur="4s" repeatCount="indefinite"/></path>
  </g>

  <!-- title -->
  <text x="470" y="52" font-family="'Exo 2','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="600"
        textLength="320" lengthAdjust="spacingAndGlyphs" fill="url(#t)">GitHub Analytics</text>
</svg>
