<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="420"
     viewBox="0 0 1200 420">

  <defs>

    <!-- Cyber Red -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff003c"/>
      <stop offset="50%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#8b001f"/>
    </linearGradient>

    <!-- Transparent Background -->
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120207" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#08080a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#160309" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Subtle Red Aura -->
    <radialGradient id="redAura">
      <stop offset="0%" stop-color="#ff003c" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#ff003c" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#ff003c" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Glow -->
    <filter id="glow"
            x="-30%" y="-30%"
            width="160%" height="160%">

      <feGaussianBlur
          stdDeviation="4"
          result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <clipPath id="panelClip">
      <rect x="5" y="5"
            width="1190"
            height="410"
            rx="20"/>
    </clipPath>

  </defs>


  <!-- ============================================ -->
  <!-- PANEL -->
  <!-- ============================================ -->

  <rect
      x="5"
      y="5"
      width="1190"
      height="410"
      rx="20"
      fill="url(#panelGradient)"
      stroke="#ff003c"
      stroke-width="2"
      filter="url(#glow)"/>

  <!-- Inner Border -->

  <rect
      x="10"
      y="10"
      width="1180"
      height="400"
      rx="17"
      fill="none"
      stroke="#ff003c"
      stroke-width="1"
      opacity="0.28"/>


  <!-- ============================================ -->
  <!-- SUBTLE ANIMATED BACKGROUND -->
  <!-- ============================================ -->

  <g clip-path="url(#panelClip)">

    <!-- Large transparent red aura -->

    <ellipse
        cx="950"
        cy="190"
        rx="450"
        ry="270"
        fill="url(#redAura)">

      <animate
          attributeName="opacity"
          values="0.25;0.65;0.25"
          dur="8s"
          repeatCount="indefinite"/>

    </ellipse>


    <!-- Scan line -->

    <rect
        x="0"
        y="30"
        width="1200"
        height="1"
        fill="#ff003c"
        opacity="0.08">

      <animate
          attributeName="y"
          values="20;400;20"
          dur="12s"
          repeatCount="indefinite"/>

    </rect>


    <!-- Circuit lines -->

    <g
        fill="none"
        stroke="#ff003c"
        stroke-width="1"
        opacity="0.11">

      <path d="M0 90 H140 L170 60 H310"/>

      <path d="M1200 90 H1070 L1040 120 H900"/>

      <path d="M0 350 H130 L160 320 H280"/>

      <path d="M1200 350 H1080 L1050 320 H930"/>

    </g>


    <!-- Small particles -->

    <g fill="#ff003c">

      <circle cx="90" cy="120" r="1.5">
        <animate
            attributeName="opacity"
            values="0.05;0.4;0.05"
            dur="4s"
            repeatCount="indefinite"/>
      </circle>

      <circle cx="1080" cy="150" r="1.5">
        <animate
            attributeName="opacity"
            values="0.05;0.35;0.05"
            dur="5s"
            repeatCount="indefinite"/>
      </circle>

      <circle cx="150" cy="300" r="1.2">
        <animate
            attributeName="opacity"
            values="0.05;0.3;0.05"
            dur="6s"
            repeatCount="indefinite"/>
      </circle>

      <circle cx="1130" cy="300" r="1.2">
        <animate
            attributeName="opacity"
            values="0.05;0.35;0.05"
            dur="5s"
            repeatCount="indefinite"/>
      </circle>

    </g>

  </g>


  <!-- ============================================ -->
  <!-- TITLE -->
  <!-- ============================================ -->

  <circle
      cx="48"
      cy="48"
      r="17"
      fill="#ff003c"
      fill-opacity="0.10"
      stroke="#ff003c"
      stroke-width="1"/>

  <circle
      cx="48"
      cy="43"
      r="5"
      fill="#ff003c"/>

  <path
      d="M39 57
         C39 51 43 48 48 48
         C53 48 57 51 57 57 Z"
      fill="#ff003c"/>


  <text
      x="78"
      y="58"
      font-family="Arial, Helvetica, sans-serif"
      font-size="32"
      font-weight="700"
      fill="#ffffff">
