  <!-- ============================================ -->

  <line
      x1="32"
      y1="365"
      x2="1168"
      y2="365"
      stroke="#ff003c"
      stroke-width="1"
      opacity="0.15"/>

  <circle
      cx="32"
      cy="365"
      r="2"
      fill="#ff003c"/>

  <circle
      cx="1168"
