#!/usr/bin/env python3
"""
Builds about-me.svg  -  every text line is justified to the same width (x=32 .. 1168),
so no line is short and none runs past the panel.

Edit the TEXT below (wrap highlighted words in **double stars**) and run:
    python make_about_svg.py
"""
import random
import re
from xml.sax.saxutils import escape

TEXT = (
    "I\u2019m an **AI Engineer** and **B.Tech graduate** in **Artificial Intelligence & Data Science**, "
    "passionate about building intelligent, scalable, and real-world solutions. My expertise spans "
    "**Machine Learning**, **Deep Learning**, and **Computer Vision**. My expertise also includes "
    "**Full-Stack Development** and **IoT**. I work with **Python, PyTorch, TensorFlow**, "
    "**React, Node.js, MongoDB**, and modern **AI tools**. I enjoy developing **AI-powered applications** "
    "that solve practical problems and create meaningful impact. I have hands-on experience building "
    "projects involving **Generative AI, Computer Vision, LLMs**, **REST APIs**, databases, and "
    "**intelligent automation**. I\u2019m continuously learning, improving my **problem-solving skills**, "
    "and exploring emerging technologies to become a **stronger engineer** and build "
    "**innovative products.**"
)

W = 1200
X0, X1 = 32, 1168            # text column
LINE_W = X1 - X0             # 1136 px every line is stretched/squeezed to
SIZE, LH = 20, 32
FIRST_Y = 105
RED, RED2 = "#ff003c", "#ff5a78"

# ---------------------------------------------------------------- measuring (Liberation Sans = Arial metrics)
try:
    from PIL import ImageFont
    _reg = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf", SIZE * 4)
    _bold = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf", SIZE * 4)

    def width(txt, bold):
        return (_bold if bold else _reg).getlength(txt) / 4
except Exception:                                   # rough fallback if the font isn't installed
    def width(txt, bold):
        return len(txt) * SIZE * (0.57 if bold else 0.53)


def tokenize(s):
    toks, bold, pend = [], False, False
    for part in re.split(r"(\*\*)", s):
        if part == "**":
            bold = not bold
            continue
        for m in re.finditer(r"\S+|\s+", part):
            if m.group(0).isspace():
                pend = True
            else:
                toks.append(dict(w=m.group(0), bold=bold, sp=pend and bool(toks)))
                pend = False
    return toks


def wrap(toks):
    lines, cur, cur_w = [], [], 0.0
    space = width(" ", False)
    for t in toks:
        w = width(t["w"], t["bold"]) + (space if (cur and t["sp"]) else 0)
        if cur and cur_w + w > LINE_W:
            lines.append(cur)
            cur, cur_w = [], 0.0
            w = width(t["w"], t["bold"])
        cur.append(t)
        cur_w += w
    if cur:
        lines.append(cur)
    return lines


def natural_width(line):
    space, total = width(" ", False), 0.0
    for i, t in enumerate(line):
        total += width(t["w"], t["bold"]) + (space if (i and t["sp"]) else 0)
    return total


# ---------------------------------------------------------------- build
rnd = random.Random(4)
lines = wrap(tokenize(TEXT))
n = len(lines)
last_y = FIRST_Y + (n - 1) * LH
STATUS_Y = last_y + 36
H = STATUS_Y + 55
PW, PH = W - 10, H - 10      # panel size


def line_svg(i, line):
    y = FIRST_Y + i * LH
    spans = []
    for k, t in enumerate(line):
        txt = (" " if (k and t["sp"]) else "") + escape(t["w"])
        if t["bold"]:
            spans.append(f'<tspan fill="{RED}" font-weight="700">{txt}'
                         f'<animate attributeName="fill" values="{RED};{RED2};{RED}" dur="{rnd.uniform(2.6, 4.2):.1f}s" '
                         f'begin="{rnd.uniform(0.5, 3):.1f}s" repeatCount="indefinite"/></tspan>')
        else:
            spans.append(f"<tspan>{txt}</tspan>")
    justify = ""
    if i < n - 1:       # every line except the last one is stretched to the full column width
        justify = f' textLength="{LINE_W}" lengthAdjust="spacing"'
    begin = 0.35 + i * 0.16
    return (f'<g opacity="0">'
            f'<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="{begin:.2f}s" fill="freeze"/>'
            f'<animateTransform attributeName="transform" type="translate" from="-18 0" to="0 0" dur="0.7s" '
            f'begin="{begin:.2f}s" fill="freeze"/>'
            f'<text class="t" x="{X0}" y="{y}" font-family="Arial, Helvetica, sans-serif" font-size="{SIZE}"{justify}>'
            f'{"".join(spans)}</text></g>')


text_block = "\n  ".join(line_svg(i, l) for i, l in enumerate(lines))

# floating binary digits (very faint, behind the text)
bits = []
for _ in range(16):
    x, y0 = rnd.uniform(20, W - 20), rnd.uniform(200, H)
    d = rnd.uniform(7, 14)
    bits.append(f'<text x="{x:.0f}" y="{y0:.0f}" font-family="Courier New, monospace" font-size="{rnd.randint(11, 16)}" '
                f'fill="{RED}" opacity="0">{rnd.choice("01")}'
                f'<animate attributeName="opacity" values="0;0.22;0" dur="{d:.1f}s" repeatCount="indefinite"/>'
                f'<animateTransform attributeName="transform" type="translate" values="0 0;0 -{rnd.randint(110, 190)}" '
                f'dur="{d:.1f}s" repeatCount="indefinite"/></text>')

perim = 2 * (PW + PH)

svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" role="img"
     aria-label="About Me - AI Engineer and B.Tech graduate in Artificial Intelligence and Data Science">

  <defs>
    <style>
      .t {{ fill: #eeeeee; }}
      @media (prefers-color-scheme: light) {{ .t {{ fill: #1f2328; }} }}
    </style>

    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120207" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#08080a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#160309" stop-opacity="0.28"/>
    </linearGradient>

    <radialGradient id="redAura">
      <stop offset="0%" stop-color="{RED}" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="{RED}" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="{RED}" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="{RED}" stop-opacity="0"/>
      <stop offset="0.5" stop-color="{RED}" stop-opacity="0.10"/>
      <stop offset="1" stop-color="{RED}" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="statusLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="{RED}" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="{RED}" stop-opacity="0.12"/>
      <stop offset="1" stop-color="{RED}" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="panelClip"><rect x="5" y="5" width="{PW}" height="{PH}" rx="20"/></clipPath>

    <path id="circuitA" d="M0 90 H140 L170 60 H310"/>
    <path id="circuitB" d="M1200 90 H1070 L1040 120 H900"/>
    <path id="circuitC" d="M0 {H - 70} H130 L160 {H - 100} H280"/>
    <path id="circuitD" d="M1200 {H - 70} H1080 L1050 {H - 100} H930"/>
  </defs>

  <!-- PANEL -->
  <rect x="5" y="5" width="{PW}" height="{PH}" rx="20" fill="url(#panelGradient)" stroke="{RED}" stroke-width="2" filter="url(#glow)"/>
  <rect x="10" y="10" width="{W - 20}" height="{H - 20}" rx="17" fill="none" stroke="{RED}" stroke-width="1" opacity="0.28"/>

  <!-- light that runs around the border -->
  <rect x="5" y="5" width="{PW}" height="{PH}" rx="20" fill="none" stroke="{RED2}" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="190 {perim - 190}" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-{perim}" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- BACKGROUND ANIMATION -->
  <g clip-path="url(#panelClip)">
    <ellipse cx="950" cy="{H // 2 - 20}" rx="450" ry="270" fill="url(#redAura)">
      <animate attributeName="opacity" values="0.25;0.7;0.25" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <rect x="-320" y="0" width="320" height="{H}" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="{W + 320} 0" dur="9s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="30" width="{W}" height="1" fill="{RED}" opacity="0.1">
      <animate attributeName="y" values="20;{H - 20};20" dur="12s" repeatCount="indefinite"/>
    </rect>

    <!-- circuit lines with flowing dashes and travelling dots -->
    <g fill="none" stroke="{RED}" stroke-width="1" opacity="0.2" stroke-dasharray="6 10">
      <use href="#circuitA"><animate attributeName="stroke-dashoffset" from="0" to="-160" dur="5s" repeatCount="indefinite"/></use>
      <use href="#circuitB"><animate attributeName="stroke-dashoffset" from="0" to="-160" dur="5s" repeatCount="indefinite"/></use>
      <use href="#circuitC"><animate attributeName="stroke-dashoffset" from="0" to="-160" dur="6s" repeatCount="indefinite"/></use>
      <use href="#circuitD"><animate attributeName="stroke-dashoffset" from="0" to="-160" dur="6s" repeatCount="indefinite"/></use>
    </g>
    <g fill="{RED2}" filter="url(#glow)">
      <circle r="2.6"><animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#circuitA"/></animateMotion></circle>
      <circle r="2.6"><animateMotion dur="5.5s" begin="1s" repeatCount="indefinite"><mpath href="#circuitB"/></animateMotion></circle>
      <circle r="2.6"><animateMotion dur="5s" begin="0.5s" repeatCount="indefinite"><mpath href="#circuitC"/></animateMotion></circle>
      <circle r="2.6"><animateMotion dur="6s" begin="2s" repeatCount="indefinite"><mpath href="#circuitD"/></animateMotion></circle>
    </g>

    <!-- faint rising binary -->
    {"".join(bits)}
  </g>

  <!-- TITLE -->
  <circle cx="48" cy="48" r="17" fill="{RED}" fill-opacity="0.10" stroke="{RED}" stroke-width="1"/>
  <circle cx="48" cy="48" r="17" fill="none" stroke="{RED}" stroke-width="2">
    <animate attributeName="r" values="17;28" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="43" r="5" fill="{RED}"/>
  <path d="M39 57 C39 51 43 48 48 48 C53 48 57 51 57 57 Z" fill="{RED}"/>

  <text class="t" x="78" y="58" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">About</text>
  <text x="180" y="58" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="{RED}" filter="url(#glow)">Me
    <animate attributeName="opacity" values="1;0.65;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <line x1="230" y1="51" x2="300" y2="51" stroke="{RED}" stroke-width="3" stroke-linecap="round" stroke-dasharray="70" stroke-dashoffset="70">
    <animate attributeName="stroke-dashoffset" from="70" to="0" dur="1s" begin="0.2s" fill="freeze"/>
  </line>

  <!-- TEXT: {n} lines, each justified to the same width -->
  {text_block}

  <!-- BOTTOM STATUS -->
  <line x1="{X0}" y1="{STATUS_Y}" x2="{X1}" y2="{STATUS_Y}" stroke="url(#statusLine)" stroke-width="1.5"/>
  <circle cx="{X0}" cy="{STATUS_Y}" r="2" fill="{RED}">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="{X1}" cy="{STATUS_Y}" r="2" fill="{RED}">
    <animate attributeName="r" values="2;4;2" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" cy="{STATUS_Y}" fill="{RED2}" filter="url(#glow)">
    <animate attributeName="cx" values="{X0};{X1};{X0}" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
'''

with open("about-me.svg", "w", encoding="utf-8") as f:
    f.write(svg)

print(f"about-me.svg written: {n} lines, {W}x{H}")
for i, l in enumerate(lines):
    nw = natural_width(l)
    tag = "natural (last line)" if i == n - 1 else f"stretch {100 * (LINE_W / nw - 1):+.1f}%"
    print(f"  line {i + 1}: {nw:6.0f}px  {tag}")