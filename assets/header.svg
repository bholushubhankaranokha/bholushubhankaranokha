<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600"
     height="400"
     viewBox="0 0 1600 400">

  <!-- Background -->
  <rect width="1600" height="400" rx="20" fill="#050505"/>

  <!-- Red border -->
  <rect x="2" y="2"
        width="1596"
        height="396"
        rx="20"
        fill="none"
        stroke="#ff1744"
        stroke-width="3"/>

  <!-- Your 1:1 image -->
  <image
      href="portrait.png"
      x="0"
      y="0"
      width="400"
      height="400"
      preserveAspectRatio="xMidYMid slice"/>

  <!-- Divider -->
  <line
      x1="400"
      y1="0"
      x2="400"
      y2="400"
      stroke="#ff1744"
      stroke-width="3"/>

  <!-- ============================= -->
  <!-- MAIN TEXT -->
  <!-- ============================= -->

  <text
      x="1000"
      y="125"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="44"
      font-weight="700"
      fill="#ffffff">
      Hey, I'm Bholu Shubhankar Anokha
  </text>

  <text
      x="1000"
      y="185"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="25"
      font-weight="600"
      fill="#ff1744">
      AI Engineer | Machine Learning &amp; Deep Learning
  </text>

  <!-- ============================= -->
  <!-- CLICKABLE SOCIAL ICONS -->
  <!-- ============================= -->

  <!-- EMAIL -->
  <a href="mailto:bholushubhankaranokha@gmail.com"
     target="_blank">

    <g transform="translate(790 275)"
       cursor="pointer">

      <circle
          cx="0"
          cy="0"
          r="30"
          fill="#100000"
          stroke="#ff1744"
          stroke-width="2"/>

      <!-- Envelope -->
      <rect
          x="-14"
          y="-10"
          width="28"
          height="20"
          rx="3"
          fill="none"
          stroke="#ff1744"
          stroke-width="2"/>

      <path
          d="M-13 -8 L0 2 L13 -8"
          fill="none"
          stroke="#ff1744"
          stroke-width="2"/>

    </g>

  </a>


  <!-- LINKEDIN -->
  <a href="https://www.linkedin.com/in/bholushubhankaranokha/"
     target="_blank">

    <g transform="translate(900 275)"
       cursor="pointer">

      <circle
          cx="0"
          cy="0"
          r="30"
          fill="#100000"
          stroke="#ff1744"
          stroke-width="2"/>

      <!-- LinkedIn -->
      <text
          x="0"
          y="9"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="25"
          font-weight="900"
          fill="#ff1744">
        in
      </text>

    </g>

  </a>


  <!-- PORTFOLIO -->
  <a href="https://YOUR-WEBSITE.com"
     target="_blank">

    <g transform="translate(1010 275)"
       cursor="pointer">

      <circle
          cx="0"
          cy="0"
          r="30"
          fill="#100000"
          stroke="#ff1744"
          stroke-width="2"/>

      <!-- Globe -->
      <circle
          cx="0"
          cy="0"
          r="14"
          fill="none"
          stroke="#ff1744"
          stroke-width="2"/>

      <ellipse
          cx="0"
          cy="0"
          rx="6"
          ry="14"
          fill="none"
          stroke="#ff1744"
          stroke-width="1.5"/>

      <path
          d="M-13 0 H13"
          fill="none"
          stroke="#ff1744"
          stroke-width="1.5"/>

    </g>

  </a>


  <!-- Labels -->
  <text x="790" y="330"
        text-anchor="middle"
        font-family="Arial"
        font-size="15"
        fill="#ffffff">
    Email
  </text>

  <text x="900" y="330"
        text-anchor="middle"
        font-family="Arial"
        font-size="15"
        fill="#ffffff">
    LinkedIn
  </text>

  <text x="1010" y="330"
        text-anchor="middle"
        font-family="Arial"
        font-size="15"
        fill="#ffffff">
    Portfolio
  </text>

</svg>